backend:
  name: github
  repo: ignaciorodesg/doria-clinic-web
  branch: main
  base_url: https://sveltia-cms-auth.doriaclinicweb.workers.dev

media_folder: "public/img"
public_folder: "/img"

i18n:
  structure: multiple_folders
  locales: [es, ca, en]
  default_locale: es

collections:
  - name: tratamientos
    label: "Tratamientos"
    label_singular: "Tratamiento"
    folder: "src/content/tratamientos"
    create: true
    slug: "{{slug}}"
    i18n: true
    summary: "{{titulo}}"
    fields:
      - { name: idioma, label: "Idioma", widget: hidden, default: es }
      - { name: titulo, label: "Título", widget: string, i18n: true }
      - name: especialidad
        label: "Especialidad"
        widget: relation
        collection: especialidades
        search_fields: [titulo]
        value_field: "{{slug}}"
        display_fields: [titulo]
      - name: resumen
        label: "Resumen"
        hint: "Dos frases. Sale en los listados y en Google. Entre 80 y 300 caracteres."
        widget: text
        i18n: true
      - { name: precio_desde, label: "Precio desde (€)", widget: number, required: false, value_type: int }
      - { name: financiacion_meses, label: "Financiación (meses)", widget: number, required: false, value_type: int }
      - { name: duracion_sesion, label: "Duración de la sesión", widget: string, required: false }
      - { name: numero_sesiones, label: "Número de sesiones", widget: string, required: false }
      - name: anestesia
        label: "Anestesia"
        widget: select
        required: false
        options: ["no", "local", "sedacion"]
      - name: especialista
        label: "Especialista que lo firma"
        widget: relation
        collection: equipo
        search_fields: [nombre]
        value_field: "{{slug}}"
        display_fields: [nombre, cargo]
      - name: cuando_se_indica
        label: "Cuándo se indica"
        hint: "Situaciones concretas del paciente. Mínimo dos."
        widget: list
        field: { name: situacion, label: "Situación", widget: string }
        i18n: true
      - name: proceso
        label: "Proceso"
        widget: list
        required: false
        i18n: true
        fields:
          - { name: titulo, label: "Paso", widget: string }
          - { name: descripcion, label: "Descripción", widget: text }
          - { name: duracion, label: "Duración", widget: string, required: false }
      - name: faqs
        label: "Preguntas frecuentes"
        hint: "Se convierten solas en datos estructurados para Google."
        widget: list
        required: false
        i18n: true
        fields:
          - { name: pregunta, label: "Pregunta", widget: string }
          - { name: respuesta, label: "Respuesta", widget: text }
      - name: casos
        label: "Casos"
        hint: "Solo con consentimiento del paciente firmado y archivado."
        widget: list
        required: false
        fields:
          - { name: antes, label: "Antes", widget: image }
          - { name: despues, label: "Después", widget: image }
          - { name: descripcion, label: "Descripción", widget: string }
          - { name: consentimiento_firmado, label: "Consentimiento firmado y archivado", widget: boolean, default: false }
      - { name: imagen, label: "Imagen de cabecera", widget: image, required: false, hint: "Si se deja vacía, se usa la imagen de cabecera de la especialidad." }
      - { name: actualizado, label: "Última revisión", widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - name: seo
        label: "Google"
        widget: object
        i18n: true
        fields:
          - { name: titulo_seo, label: "Título en Google", widget: string, pattern: ['^.{1,60}$', 'Máximo 60 caracteres'] }
          - { name: meta_descripcion, label: "Descripción en Google", widget: text, pattern: ['^.{1,155}$', 'Máximo 155 caracteres'] }
          - { name: noindex, label: "Ocultar de Google", widget: boolean, default: false }
      - { name: body, label: "Contenido", widget: markdown, i18n: true }

  - name: especialidades
    label: "Especialidades"
    label_singular: "Especialidad"
    folder: "src/content/especialidades"
    create: true
    slug: "{{slug}}"
    i18n: true
    summary: "{{titulo}}"
    fields:
      - { name: idioma, label: "Idioma", widget: hidden, default: es }
      - { name: titulo, label: "Título", widget: string, i18n: true }
      - { name: subtitulo, label: "Subtítulo", widget: string, required: false, i18n: true }
      - { name: resumen, label: "Resumen", widget: text, i18n: true }
      - { name: resumen_corto, label: "Resumen corto (tarjeta de la home)", widget: text, i18n: true, required: false, pattern: ['^.{1,130}$', 'Máximo 130 caracteres: no debe ocupar más de 4 líneas en la tarjeta'], hint: "Si se deja vacío, se usa el Resumen normal (puede no caber en 4 líneas)." }
      - { name: orden, label: "Orden en el menú", widget: number, value_type: int }
      - { name: mostrar_en_home, label: "Mostrar en la home", widget: boolean, default: true }
      - { name: icono, label: "Icono (cuadrícula de la home)", widget: image, required: false, hint: "SVG a una tinta, sin fondo. Si se deja vacío, la tarjeta se muestra sin icono." }
      - name: especialista
        label: "Especialista responsable"
        widget: relation
        required: false
        collection: equipo
        search_fields: [nombre]
        value_field: "{{slug}}"
        display_fields: [nombre]
      - { name: imagen, label: "Imagen de cabecera", widget: image, required: false, hint: "Fondo de la cabecera de esta página (donde está el título). Si se deja vacía, la cabecera se ve como ahora, sin foto." }
      - name: seo
        label: "Google"
        widget: object
        i18n: true
        fields:
          - { name: titulo_seo, label: "Título en Google", widget: string }
          - { name: meta_descripcion, label: "Descripción en Google", widget: text }
          - { name: noindex, label: "Ocultar de Google", widget: boolean, default: false }
      - { name: body, label: "Contenido", widget: markdown, i18n: true }

  - name: equipo
    label: "Equipo"
    label_singular: "Doctor"
    folder: "src/content/equipo"
    create: true
    slug: "{{slug}}"
    summary: "{{nombre}} — {{cargo}}"
    fields:
      - { name: nombre, label: "Nombre", widget: string }
      - { name: numero_colegiado, label: "Número de colegiado", widget: string }
      - { name: orden, label: "Orden", widget: number, value_type: int }
      - { name: foto, label: "Foto", widget: image, required: false }
      - { name: cargo, label: "Cargo (ES)", widget: string }
      - { name: cargo_ca, label: "Cargo (CA)", widget: string, required: false }
      - { name: cargo_en, label: "Cargo (EN)", widget: string, required: false }
      - name: titulacion
        label: "Titulación (ES)"
        widget: list
        field: { name: titulo, label: "Título", widget: string }
      - name: titulacion_ca
        label: "Titulación (CA)"
        widget: list
        required: false
        field: { name: titulo, label: "Títol", widget: string }
      - name: titulacion_en
        label: "Titulación (EN)"
        widget: list
        required: false
        field: { name: titulo, label: "Qualification", widget: string }
      - name: especialidades
        label: "Especialidades"
        widget: list
        required: false
        field: { name: nombre, label: "Especialidad", widget: string }
      - { name: bio, label: "Descripción corta (ES)", widget: text, required: false, hint: "La que sale en la home y en la ficha lateral de las páginas de especialidad." }
      - { name: bio_ca, label: "Descripción corta (CA)", widget: text, required: false }
      - { name: bio_en, label: "Descripción corta (EN)", widget: text, required: false }
      - name: trayectoria
        label: "Trayectoria, página propia (ES)"
        hint: "Uno o varios párrafos. Es el texto principal de su página /equipo/."
        widget: list
        required: false
        field: { name: parrafo, label: "Párrafo", widget: text }
      - name: trayectoria_ca
        label: "Trayectoria, página propia (CA)"
        widget: list
        required: false
        field: { name: parrafo, label: "Paràgraf", widget: text }
      - name: trayectoria_en
        label: "Trayectoria, página propia (EN)"
        widget: list
        required: false
        field: { name: parrafo, label: "Paragraph", widget: text }
      - name: agenda
        label: "Agenda: congresos, cursos, ponencias (ES)"
        hint: "Cada línea es un hito con su fecha. El enlace es opcional."
        widget: list
        required: false
        fields:
          - { name: fecha, label: "Fecha", widget: string }
          - { name: texto, label: "Texto", widget: string }
          - { name: enlace, label: "Enlace", widget: string, required: false }
      - name: agenda_ca
        label: "Agenda (CA)"
        widget: list
        required: false
        fields:
          - { name: fecha, label: "Data", widget: string }
          - { name: texto, label: "Text", widget: string }
          - { name: enlace, label: "Enllaç", widget: string, required: false }
      - name: agenda_en
        label: "Agenda (EN)"
        widget: list
        required: false
        fields:
          - { name: fecha, label: "Date", widget: string }
          - { name: texto, label: "Text", widget: string }
          - { name: enlace, label: "Link", widget: string, required: false }
      - { name: noindex, label: "Ocultar su página de Google", widget: boolean, default: false }

  - name: home
    label: "Inicio"
    label_singular: "Inicio"
    folder: "src/content/home"
    create: false
    extension: md
    identifier_field: idioma
    summary: "{{idioma}}"
    fields:
      - { name: idioma, label: "Idioma", widget: select, options: [es, ca, en] }
      - { name: hero_titular, label: "Titular", widget: string }
      - { name: hero_entradilla, label: "Entradilla", widget: text }
      - name: hero_imagenes
        label: "Fotos del slider de portada"
        hint: "Se muestran en bucle, una tras otra. El orden aquí es el orden en el que se ven."
        widget: list
        min: 1
        fields:
          - { name: src, label: "Imagen", widget: image }
          - { name: alt, label: "Texto alternativo", widget: string }
      - { name: cta_texto, label: "Texto del botón principal", widget: string }
      - { name: intro_frase, label: "Frase de introducción", widget: string }
      - name: intro_parrafos
        label: "Párrafos de introducción"
        widget: list
        field: { name: parrafo, label: "Párrafo", widget: text }
      - { name: tratamientos_titulo, label: "Título sección Tratamientos", widget: string }
      - { name: equipo_titulo, label: "Título sección Equipo", widget: string }
      - { name: elegirnos_titulo, label: "Título Por qué elegirnos", widget: string }
      - name: elegirnos
        label: "Por qué elegirnos (razones)"
        widget: list
        min: 1
        fields:
          - { name: titulo, label: "Razón", widget: string }
          - { name: texto, label: "Descripción", widget: text }
      - { name: instalaciones_titulo, label: "Título Instalaciones", widget: string }
      - { name: instalaciones_texto, label: "Texto Instalaciones", widget: text }
      - name: instalaciones_imagenes
        label: "Imágenes de Instalaciones"
        widget: list
        fields:
          - { name: src, label: "Imagen", widget: image }
          - { name: alt, label: "Texto alternativo", widget: string }
      - name: seo
        label: "Google"
        widget: object
        fields:
          - { name: titulo_seo, label: "Título en Google", widget: string, pattern: ['^.{1,60}$', 'Máximo 60 caracteres'] }
          - { name: meta_descripcion, label: "Descripción en Google", widget: text, pattern: ['^.{1,155}$', 'Máximo 155 caracteres'] }
          - { name: noindex, label: "Ocultar de Google", widget: boolean, default: false }

  - name: listados
    label: "Páginas de listado"
    label_singular: "Página de listado"
    folder: "src/content/listados"
    create: false
    extension: md
    summary: "{{pagina}} ({{idioma}})"
    fields:
      - { name: idioma, label: "Idioma", widget: select, options: [es, ca, en] }
      - { name: pagina, label: "Página", widget: select, options: [especialidades, tratamientos] }
      - { name: h1, label: "Título de la página", widget: string }
      - { name: lede, label: "Entradilla", widget: text }
      - { name: faqs_titulo, label: "Título de las preguntas frecuentes", widget: string }
      - name: faqs
        label: "Preguntas frecuentes"
        widget: list
        required: false
        fields:
          - { name: pregunta, label: "Pregunta", widget: string }
          - { name: respuesta, label: "Respuesta", widget: text }
      - name: seo
        label: "Google"
        widget: object
        fields:
          - { name: titulo_seo, label: "Título en Google", widget: string, pattern: ['^.{1,60}$', 'Máximo 60 caracteres'] }
          - { name: meta_descripcion, label: "Descripción en Google", widget: text, pattern: ['^.{1,155}$', 'Máximo 155 caracteres'] }
          - { name: noindex, label: "Ocultar de Google", widget: boolean, default: false }

  - name: paginas
    label: "Páginas sueltas"
    label_singular: "Página"
    folder: "src/content/paginas"
    create: true
    extension: md
    slug: "{{idioma}}-{{ruta}}"
    summary: "{{titulo}} ({{idioma}})"
    fields:
      - { name: idioma, label: "Idioma", widget: select, options: [es, ca, en] }
      - { name: ruta, label: "Ruta (URL)", widget: string, hint: "Sin barras. Ej.: aviso-legal, contacto" }
      - { name: titulo, label: "Título (H1)", widget: string }
      - { name: lede, label: "Entradilla", widget: text, required: false }
      - { name: actualizado, label: "Última actualización", widget: string, required: false, hint: "Ej.: septiembre de 2026" }
      - name: seo
        label: "Google"
        widget: object
        fields:
          - { name: titulo_seo, label: "Título en Google", widget: string, pattern: ['^.{1,60}$', 'Máximo 60 caracteres'] }
          - { name: meta_descripcion, label: "Descripción en Google", widget: text, pattern: ['^.{1,155}$', 'Máximo 155 caracteres'] }
          - { name: noindex, label: "Ocultar de Google", widget: boolean, default: false }
      - { name: body, label: "Contenido", widget: markdown }

  - name: ajustes
    label: "Datos de la clínica"
    files:
      - name: clinica
        label: "Teléfono, dirección y horarios"
        file: "src/data/clinica.json"
        fields:
          - { name: nombre, label: "Nombre", widget: string }
          - { name: razon_social, label: "Razón social", widget: string, required: false }
          - { name: telefono, label: "Teléfono", widget: string }
          - { name: telefono_urgencias, label: "Teléfono de urgencias", widget: string, required: false }
          - { name: whatsapp, label: "WhatsApp (con prefijo, sin +)", widget: string }
          - { name: email, label: "Email", widget: string }
          - name: direccion
            label: "Dirección"
            widget: object
            fields:
              - { name: calle, label: "Calle y número", widget: string }
              - { name: codigo_postal, label: "Código postal", widget: string }
              - { name: ciudad, label: "Ciudad", widget: string }
              - { name: barrio, label: "Barrio", widget: string }
          - name: coordenadas
            label: "Coordenadas"
            widget: object
            fields:
              - { name: lat, label: "Latitud", widget: number, required: false, value_type: float }
              - { name: lng, label: "Longitud", widget: number, required: false, value_type: float }
          - name: horarios
            label: "Horarios"
            widget: list
            fields:
              - { name: dias, label: "Días", widget: string }
              - { name: franja, label: "Horario", widget: string }
          - { name: primera_visita_gratuita, label: "Primera visita gratuita", widget: boolean, default: true }
          - name: primera_visita
            label: "Módulo \"Tu primera visita\" (todas las páginas)"
            widget: object
            fields:
              - { name: titulo, label: "Título (español)", widget: string }
              - { name: titulo_ca, label: "Título (català)", widget: string }
              - { name: titulo_en, label: "Title (English)", widget: string }
              - { name: texto, label: "Texto (español)", widget: text }
              - { name: texto_ca, label: "Texto (català)", widget: text }
              - { name: texto_en, label: "Text (English)", widget: text }
              - { name: cta, label: "Botón (español)", widget: string }
              - { name: cta_ca, label: "Botó (català)", widget: string }
              - { name: cta_en, label: "Button (English)", widget: string }
              - { name: puntos, label: "Puntos (español)", widget: list, field: { name: punto, label: "Punto", widget: string } }
              - { name: puntos_ca, label: "Punts (català)", widget: list, field: { name: punt, label: "Punt", widget: string } }
              - { name: puntos_en, label: "Points (English)", widget: list, field: { name: point, label: "Point", widget: string } }
          - { name: software_citas, label: "Enlace para pedir cita", widget: string, required: false }
          - { name: google_business_profile, label: "Perfil de Google Business", widget: string, required: false }
          - { name: nombre_google_maps, label: "Nombre exacto en Google Maps", widget: string, required: false, hint: "Tal cual aparece en la ficha de Google Business (Perfil de Empresa). Se usa para que el mapa incrustado muestre el pin con el nombre. Si se deja vacío, el mapa mostrará un pin sin etiqueta en las coordenadas exactas." }
          - { name: google_valoracion, label: "Valoración media en Google (de 0 a 5)", widget: number, value_type: float, min: 0, max: 5, default: 5 }
          - { name: google_num_resenas, label: "Número de reseñas en Google", widget: number, value_type: int, min: 0, hint: "Actualízalo de vez en cuando para que coincida con el número real en tu ficha de Google." }
          - name: redes
            label: "Redes"
            widget: object
            fields:
              - { name: instagram, label: "Instagram", widget: string, required: false }
              - { name: linkedin, label: "LinkedIn", widget: string, required: false }
          - { name: google_analytics_id, label: "ID de Google Analytics (G-XXXXXXXXXX)", widget: string, required: false, hint: "Déjalo vacío para desactivar Google Analytics en todo el sitio. Solo se carga si el visitante acepta las cookies analíticas." }
      - name: resenas
        label: "Reseñas de Google (carrusel)"
        file: "src/data/resenas.json"
        fields:
          - name: resenas
            label: "Reseñas"
            widget: list
            summary: "{{fields.autor}}"
            fields:
              - { name: autor, label: "Autor", widget: string }
              - { name: texto_es, label: "Texto (español)", widget: text }
              - { name: texto_ca, label: "Texto (català)", widget: text }
              - { name: texto_en, label: "Texto (English)", widget: text }
